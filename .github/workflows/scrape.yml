name: Scrape UEFA Rankings

on:
  schedule:
    # Match windows: 17:00, 18:30, 20:30, 22:30 UTC
    - cron: '0 17 * * *'
    - cron: '30 18 * * *'
    - cron: '30 20 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: false
        default: 'current'
        type: choice
        options:
          - current
          - all_seasons
      skip_rounds:
        description: 'Skip per-round scraping (faster, country totals only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      delay:
        description: 'Delay between team page requests (seconds)'
        required: false
        default: '1.5'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Restore round cache
        uses: actions/cache@v4
        with:
          path: public/data/team_rounds_cache.json
          key: rounds-cache-${{ github.run_id }}
          restore-keys: rounds-cache-

      - name: Scrape current season (with rounds)
        if: ${{ github.event.inputs.mode != 'all_seasons' }}
        run: |
          DELAY="${{ github.event.inputs.delay || '1.5' }}"
          SKIP="${{ github.event.inputs.skip_rounds || 'false' }}"
          ARGS="--mode current --delay $DELAY"
          if [ "$SKIP" = "true" ]; then ARGS="$ARGS --skip-rounds"; fi
          python scraper/scraper.py $ARGS

      - name: Scrape all seasons (historical bootstrap)
        if: ${{ github.event.inputs.mode == 'all_seasons' }}
        run: |
          DELAY="${{ github.event.inputs.delay || '2.0' }}"
          python scraper/scraper.py --mode all_seasons --delay $DELAY

      - name: Commit and push
        run: |
          git config user.name "UEFA Scraper Bot"
          git config user.email "bot@github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "chore: update rankings $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
